quarkus.application.name=sysfoo
app.version=1.0.0

# Base config (applies to dev/test/prod): embedded in-memory H2.
# Kept unprofiled so the packaged jar boots on H2 out of the box, matching the
# original Spring app's default (no-profile) runtime.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
quarkus.hibernate-orm.database.generation=drop-and-create

# PostgreSQL (opt-in): build/run with -Dquarkus.profile=postgres. db-kind is a
# build-time property, so switching to Postgres requires building under this profile.
%postgres.quarkus.datasource.db-kind=postgresql
%postgres.quarkus.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
%postgres.quarkus.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
%postgres.quarkus.datasource.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sysfoo}
%postgres.quarkus.hibernate-orm.database.generation=update
%postgres.quarkus.hibernate-orm.log.sql=true

# Connection resilience for PostgreSQL: Agroal equivalents of the original HikariCP
# pool tuning (connection-timeout, maximum-pool-size, minimum-idle, max-lifetime,
# idle-timeout, connection-test-query).
%postgres.quarkus.datasource.jdbc.acquisition-timeout=30S
%postgres.quarkus.datasource.jdbc.max-size=10
%postgres.quarkus.datasource.jdbc.min-size=2
%postgres.quarkus.datasource.jdbc.max-lifetime=2000S
%postgres.quarkus.datasource.jdbc.idle-removal-interval=5M
%postgres.quarkus.datasource.jdbc.validation-query-sql=SELECT 1
%postgres.quarkus.datasource.jdbc.background-validation-interval=2M
